<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liepaja Bunker 3D</title>
    <!-- Model Viewer Script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .image-gallery img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Liepaja Bunker Project</h1>

    <!-- 4 Images Gallery -->
    <div class="image-gallery">
        <img src="images/bunker(1).jpg" alt="Bunker Image 1">
        <img src="images/bunker(2).jpg" alt="Bunker Image 2">
        <img src="images/bunker(4).jpg" alt="Bunker Image 4">
        <img src="images/bunker.jpg" alt="Bunker Image Main">
    </div>

    <!-- 3D Model Display -->
    <h2>3D Model View</h2>
    <model-viewer 
      src="models/bunker.glb" 
      alt="3D Bunker Model" 
      auto-rotate 
      camera-controls 
      shadow-intensity="1" 
      style="width: 100%; height: 500px; background-color: #ffffff; border-radius: 8px;">
    </model-viewer>

</body>
</html>
